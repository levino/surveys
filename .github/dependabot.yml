# Abhaengigkeiten automatisch aktualisieren -- moeglichst ohne Nachfrage.
#
# Ziel: Levin soll nichts babysitten. Sicherheits- und Routine-Updates rollen
# vollautomatisch durch (automerge.yml labelt `automerge` und mergt, sobald die
# Checks gruen sind), nur Major-Updates landen auf seinem Tisch -- gebuendelt
# als ein Sammel-PR je Oekosystem.
#
# Warum die Gruppen (`groups`)?
#
#   * `minor-and-patch` (applies-to: version-updates): ohne Gruppe oeffnet
#     Dependabot pro Abhaengigkeit einen eigenen PR -- vier Actions-Bumps sind
#     dann vier PRs. Mit `patterns: ["*"]` wird daraus EIN Sammel-PR je
#     Oekosystem, den automerge.yml in einem Rutsch wegmergt.
#   * `security` (applies-to: security-updates): Security-Updates sind eine
#     eigene Welt -- Dependabot mischt sie nie mit Version-Updates in einen PR
#     und braucht darum eine zweite Gruppe. Ohne sie kommt pro Advisory ein
#     eigener PR (genau der Schwall vom 2026-09-08: postcss-selector-parser,
#     fast-uri, nanoid, browserslist einzeln). Mit ihr: ein PR je Oekosystem.
#   * `majors` (applies-to: version-updates): Major-Updates matchen die Gruppe
#     `minor-and-patch` nicht (dort fehlt `major` in `update-types`) und
#     fielen darum bisher als je ein eigener PR heraus. Das war ein Griff ins
#     Klo: die Umstellung auf Gruppen hat den nie angelegten Rueckstau auf
#     einmal freigegeben, 136 offene Major-PRs an einem Tag. Diese dritte
#     Gruppe macht daraus EIN Review-Paket je Oekosystem.
#     Draufschauen soll Levin trotzdem: automerge.yml erkennt die Gruppe am
#     `dependency-group: majors` und labelt sie `major` -- kein Automerge.
#     (Dependabot erlaubt beliebig viele Gruppen je Eintrag; eine Abhaengigkeit
#     landet immer in der ERSTEN Gruppe, die sie matcht -- darum steht
#     `minor-and-patch` vor `majors`.)
#
# Warum `open-pull-requests-limit` HOCH steht (und nicht niedrig)?
#
#   Das Limit war nie die Volumenbremse -- das sind die Gruppen: mit drei
#   Gruppen ueber `patterns: ["*"]` oeffnet Dependabot hoechstens drei PRs je
#   Eintrag (`minor-and-patch`, `security`, `majors`), egal wie hoch das Limit
#   steht. Ein zu NIEDRIGES Limit dreht die Sache dagegen um und blockiert die
#   Buendelung: ist das Limit ausgeschoepft, legt Dependabot gar keinen neuen
#   PR mehr an -- auch nicht den Sammel-PR, der die Einzel-PRs ersetzen soll.
#   Genau das ist am 2026-09-08 passiert (klasse-christophers: 11 offene
#   npm-PRs bei Limit 10 -> die `majors`-Gruppe wurde nie erzeugt, waehrend
#   Repos mit Luft im Kontingent ihre Gruppe sofort bekamen). 20 ist die Luft,
#   die der Rueckstau braucht; im eingeschwungenen Zustand sind es drei.
#
# Warum `monthly`?
#
#   Jede rote Sammel-PR wurde bisher jede Woche durch eine neue ersetzt --
#   rund 470 Dependabot-PRs in 90 Tagen ueber alle Repos, nur die Haelfte
#   gemergt. Ein eigenes Intervall je Gruppe (etwa nur fuer `majors`) kennt
#   Dependabot nicht: `schedule` gilt pro Eintrag, und zwei Eintraege fuer
#   dasselbe Oekosystem und Verzeichnis sind verboten. Darum laeuft der ganze
#   Eintrag monatlich. Security-Updates ignorieren `schedule` und kommen
#   weiterhin sofort.
#
# Warum `update-types` in der Gruppe `security`?
#
#   Damit der Security-Sammel-PR keine Majors mehr enthaelt und automatisch
#   durchgehen kann. Ein Sicherheitsfix, den es nur als Major gibt, kommt als
#   eigener PR (Trailer `update-type: version-update:semver-major`) und wird
#   von automerge.yml als `major` gelabelt.
#
# Nur der GITHUB_TOKEN der Repos, kein PAT, keine App, nichts im Cluster.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    open-pull-requests-limit: 20
    groups:
      # Ein Sammel-PR fuer alle Minor-/Patch-Version-Updates. Majors fehlen hier
      # absichtlich -- die holt weiter unten die Gruppe `majors` ab.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Ein Sammel-PR fuer alle Sicherheitsupdates dieses Oekosystems statt
      # eines PRs pro Advisory.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Ein Sammel-PR fuer ALLE Major-Updates dieses Oekosystems statt eines PRs
      # pro Abhaengigkeit -- ein Review-Paket statt eines Dutzends. Bleibt per
      # Label `major` vom Automerge ausgenommen.
      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    open-pull-requests-limit: 20
    groups:
      # Ein Sammel-PR fuer alle Minor-/Patch-Version-Updates. Majors fehlen hier
      # absichtlich -- die holt weiter unten die Gruppe `majors` ab.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Ein Sammel-PR fuer alle Sicherheitsupdates dieses Oekosystems statt
      # eines PRs pro Advisory.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Ein Sammel-PR fuer ALLE Major-Updates dieses Oekosystems statt eines PRs
      # pro Abhaengigkeit -- ein Review-Paket statt eines Dutzends. Bleibt per
      # Label `major` vom Automerge ausgenommen.
      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    open-pull-requests-limit: 20
    groups:
      # Ein Sammel-PR fuer alle Minor-/Patch-Version-Updates. Majors fehlen hier
      # absichtlich -- die holt weiter unten die Gruppe `majors` ab.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Ein Sammel-PR fuer alle Sicherheitsupdates dieses Oekosystems statt
      # eines PRs pro Advisory.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Ein Sammel-PR fuer ALLE Major-Updates dieses Oekosystems statt eines PRs
      # pro Abhaengigkeit -- ein Review-Paket statt eines Dutzends. Bleibt per
      # Label `major` vom Automerge ausgenommen.
      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
    ignore:
      # templ: Dependabot kann `templ generate` nicht ausfuehren. Die
      # generierten ui/*_templ.go veralten, und der Stale-Check in der CI
      # schlaegt fehl (#32). templ von Hand aktualisieren: `go get` und
      # `templ generate` in einem Commit.
      - dependency-name: "github.com/a-h/templ"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    open-pull-requests-limit: 20
    groups:
      # Ein Sammel-PR fuer alle Minor-/Patch-Version-Updates. Majors fehlen hier
      # absichtlich -- die holt weiter unten die Gruppe `majors` ab.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Ein Sammel-PR fuer alle Sicherheitsupdates dieses Oekosystems statt
      # eines PRs pro Advisory.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Ein Sammel-PR fuer ALLE Major-Updates dieses Oekosystems statt eines PRs
      # pro Abhaengigkeit -- ein Review-Paket statt eines Dutzends. Bleibt per
      # Label `major` vom Automerge ausgenommen.
      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
